spring:
  datasource:
    # Required in prod; do not fall back to local or in-memory storage.
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
  sql:
    init:
      # Production uses a provisioned persistent database; schema/data bootstrap stays off.
      mode: never
  flyway:
    enabled: true
    # 生产环境禁止 clean，防止误删数据。
    clean-disabled: true

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
