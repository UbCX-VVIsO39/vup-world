spring:
  datasource:
    url: jdbc:h2:file:./tmp/singleplayer-save/vupworld;MODE=MySQL;NON_KEYWORDS=DAY,LOCKED;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_ON_EXIT=FALSE;WRITE_DELAY=0
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      # Flyway 接管初始化，不再通过 spring.sql.init 执行 schema.sql/data.sql。
      mode: never
      encoding: UTF-8
  flyway:
    enabled: true

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

game:
  run:
    max-day: 30
  singleplayer:
    save-directory: ./tmp/singleplayer-save
    database-name: vupworld
